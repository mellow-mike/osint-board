apiVersion: v1
kind: Service
metadata:
  name: {{ include "osint.name" . }}-api
  labels: {{- include "osint.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "osint.name" . }}
    app.kubernetes.io/component: api
  ports: [{ port: 8000, targetPort: http, name: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osint.name" . }}-web
  labels: {{- include "osint.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "osint.name" . }}
    app.kubernetes.io/component: web
  ports: [{ port: 80, targetPort: http, name: http }]

# OSINT Board module catalog — SOURCE OF TRUTH for every module in the platform.
#
# Generated once from catalog/osint-modules.csv and then hand-maintained. Validate with:
#     python scripts/catalog.py validate
# Regenerate docs/modules/CATALOG.md with:
#     python scripts/catalog.py docs
#
# Field vocabulary (enforced by scripts/catalog.py and backend/osint_board/catalog/models.py):
#   source_type : free_api | tiered_api | commercial_api | internal | tool   (as classified in the CSV)
#   category    : functional grouping (see docs/03-module-framework.md)
#   mode        : lookup (target-driven) | feed (continuous global ingest) | extract (runs over collected content)
#   access      : verified access model today —
#                 open (no key) | key_free (free key) | freemium (free tier + paid) | paid | account (registration/approval)
#                 | scrape (no API, HTML scraping) | local (runs in-process or as a local tool) | dead (endpoint gone)
#   status      : active | verify (unconfirmed availability) | changed (still exists, access model changed) | defunct
#   consumes    : entity types accepted as input   (backend/osint_board/entities/types.py)
#   produces    : entity types emitted
#   geo         : direct (emits coordinates) | derived (emits entities the geo pipeline can resolve) | none
#   layer       : default globe layer for produced geo features (catalog/layers.yaml)
#   phase       : 1 free APIs + core internals · 2 remaining internals + tools + live aircraft (opensky via adsb_network)
#                 · 3 tiered replacements · 4 commercial replacements
#   priority    : high | normal | low (ordering inside a phase)
#   replacement : internal service ids (catalog/services.yaml) that replace this module; 'local_reimpl' = trivially reimplemented in-process
#   cadence     : feed refresh cadence (realtime | 5s | 1m | 15m | hourly | 3h | daily | weekly | monthly | on_demand)
#   requires_authorization : true when the module actively probes targets (must be in an authorized scope)

version: 1
modules:

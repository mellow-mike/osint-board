[project]
name = "osint-board"
version = "0.1.0"
description = "OSINT Board backend: module framework, global feeds, investigation search and the geo API behind the globe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "geoalchemy2>=0.15",
  "httpx>=0.27",
  "redis>=5.0",
  "arq>=0.26",
  "meilisearch-python-sdk>=3.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "structlog>=24.1",
  "dnspython>=2.6",
  "phonenumbers>=8.13",
  "idna>=3.7",
  "tldextract>=5.1",
  "orjson>=3.10",
  "sgp4>=2.23",
  "python-dateutil>=2.9",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
osint-board = "osint_board.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osint_board"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.isort]
known-first-party = ["osint_board"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:osint_board.*"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
